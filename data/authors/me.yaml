bio: |
  Ahmad Wafi Bin Mahmood Zuhdi currently holds a senior lecturer position 
  at the Institute of Sustainable Energy (ISE), Universiti Tenaga Nasional 
  (UNITEN) since 2014. He received an M.Eng degree in Electronics and 
  Electrical Engineering from the University of Edinburgh in 2008. 
  He spent a year as a tutor at UNITEN before returning to the 
  University of Edinburgh in 2010 to pursue a Ph.D. in microelectronic 
  and analogue-mixed signal circuit design. Currently, his research 
  interest is in solar PV fabrication and systems, as well as other related 
  micro-nano electronics researchHe is a member of the IEEE, Board of Engineers 
  Malaysia (BEM), and Malaysia Board of Technologists (MBOT).

